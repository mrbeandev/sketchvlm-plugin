[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchvlm-plugin"
version = "0.2.0"
description = "Annotate images with SVG overlays planned by your Claude Code session. Ships as a Claude Code plugin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MrBeanDev" }]
keywords = ["vision", "vlm", "annotation", "claude-code", "mcp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=10",
    "cairosvg>=2.7",
    "numpy>=1.24",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/mrbeandev/sketchvlm-plugin"
Source = "https://github.com/mrbeandev/sketchvlm-plugin"
Issues = "https://github.com/mrbeandev/sketchvlm-plugin/issues"

[tool.setuptools.packages.find]
include = ["sketchvlm_lite*"]
